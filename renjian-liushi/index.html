<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人间六事 · 五世</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#f4eee2;
  --ink:#14110d; --ink1:#2b251d; --ink2:#584d3f; --ink3:#8b7c66; --ink4:#c2b39a;
  --cinnabar:#a5322a; --azurite:#2f5a71; --ochre:#96652f; --jade:#4a6b52; --gold:#a9842f;
  --song:"Songti SC","SimSun","Noto Serif SC",serif;
  --kai:"Kaiti SC","KaiTi","STKaiti",serif;
  --slow:cubic-bezier(.22,.61,.36,1);
}
html,body{height:100%}
body{
  background:
    radial-gradient(120% 90% at 16% 2%,#fcf8ee 0%,rgba(252,248,238,0) 58%),
    radial-gradient(90% 76% at 90% 98%,#e4dac4 0%,rgba(228,218,196,0) 60%),
    linear-gradient(170deg,#f8f3e8 0%,#f0e8d8 44%,#e5dbc7 100%);
  color:var(--ink); font-family:var(--song);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:3;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.55'/></svg>");
  opacity:.055; mix-blend-mode:multiply;
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:4;
  box-shadow:inset 0 0 200px rgba(58,42,18,.20), inset 0 0 44px rgba(58,42,18,.10);
}
.screen{display:none}
.screen.on{display:block; animation:pageIn .62s var(--slow) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wrap{max-width:1080px;margin:0 auto;padding:56px 40px 88px;position:relative;z-index:2}
.kai{font-family:var(--kai)}

/* ── 卷首 ── */
#sc-cover{height:100vh;min-height:660px;display:none}
#sc-cover.on{display:flex;align-items:center;justify-content:center}
.cover-in{position:relative;z-index:2;display:flex;gap:70px;align-items:center}
.cover-t{writing-mode:vertical-rl;text-orientation:upright;
  font-size:74px;letter-spacing:.30em;line-height:1.06;color:var(--ink);
  text-shadow:0 1px 0 rgba(255,255,255,.5);}
.cover-t{position:relative}
.cover-t small{position:absolute;left:50%;bottom:-56px;transform:translateX(-50%);
  writing-mode:horizontal-tb;white-space:nowrap;
  font-size:12px;letter-spacing:.5em;color:var(--ink3)}
.cover-l{max-width:330px}
.cover-l p{font-family:var(--kai);font-size:14.5px;line-height:2.5;color:var(--ink2);letter-spacing:.12em}
.cover-l p.hd{color:var(--ink);font-size:16px;letter-spacing:.2em;margin-bottom:16px}
.cover-l .rule{width:44px;height:1px;background:rgba(92,76,51,.4);margin:22px 0}
.cover-strip{position:absolute;left:0;right:0;bottom:0;height:230px;pointer-events:none;
  background:url("assets/journey.webp") center 40%/cover no-repeat;
  opacity:.34;mix-blend-mode:multiply;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 34%,#000 72%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 34%,#000 72%,transparent 100%);}
.btn{display:inline-block;cursor:pointer;user-select:none;font-family:var(--kai);
  font-size:13.5px;letter-spacing:.34em;padding:11px 26px 11px 30px;
  color:var(--ink1);border:1px solid rgba(92,76,51,.34);background:rgba(255,253,247,.42);
  transition:.42s var(--slow);position:relative}
.btn:hover{background:rgba(255,253,247,.85);border-color:rgba(92,76,51,.6);
  box-shadow:0 12px 28px -18px rgba(64,48,24,.7)}
.btn.ghost{border-color:transparent;color:var(--ink3)}
.btn.ghost:hover{color:var(--ink1);background:rgba(255,253,247,.5)}
.btn.zin{border-color:rgba(165,50,42,.45);color:var(--cinnabar)}
.btn.zin:hover{background:rgba(165,50,42,.07);box-shadow:none}
.btn[data-off]{opacity:.34;pointer-events:none}

/* ── 通用标题 ── */
.hd-row{display:flex;align-items:flex-end;gap:16px;border-bottom:1px solid rgba(92,76,51,.2);
  padding-bottom:13px;margin-bottom:34px}
.hd-row h1{font-size:22px;font-weight:400;letter-spacing:.26em}
.hd-row .sub{font-family:var(--kai);font-size:11.5px;letter-spacing:.3em;color:var(--ink3);
  padding-bottom:3px}
.hd-row .sp{flex:1}
.hd-row .act{font-family:var(--kai);font-size:11.5px;letter-spacing:.26em;color:var(--ink3);
  cursor:pointer;padding-bottom:3px;transition:.3s}
.hd-row .act:hover{color:var(--cinnabar)}

/* ── 五局盘 ── */
.hub-note{font-family:var(--kai);font-size:12.5px;line-height:2.4;color:var(--ink2);
  letter-spacing:.1em;margin-bottom:34px;max-width:640px}
.hub-note b{color:var(--ink);font-weight:400;border-bottom:1px solid rgba(165,50,42,.35)}
.lives{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.life-cell{position:relative;height:250px;border:1px solid rgba(92,76,51,.22);
  background:linear-gradient(176deg,rgba(255,253,247,.62),rgba(244,236,219,.34));
  padding:22px 18px;cursor:pointer;transition:.5s var(--slow);overflow:hidden}
.life-cell:hover{transform:translateY(-3px);border-color:rgba(92,76,51,.48);
  box-shadow:0 22px 44px -30px rgba(64,48,24,.66)}
.life-cell .no{font-family:var(--kai);font-size:11px;letter-spacing:.3em;color:var(--ink3)}
.life-cell .era{writing-mode:vertical-rl;text-orientation:upright;position:absolute;right:18px;
  top:22px;font-size:26px;letter-spacing:.22em;color:var(--ink2)}
.life-cell .era.an{color:var(--ink)}
.life-cell .era.mo{color:var(--azurite)}
.life-cell .yr{position:absolute;left:18px;bottom:52px;font-family:var(--kai);font-size:11px;
  letter-spacing:.16em;color:var(--ink3)}
.life-cell .bd{position:absolute;left:18px;bottom:22px;font-family:var(--kai);font-size:11.5px;
  letter-spacing:.2em;color:var(--ink2)}
.life-cell.done{background:linear-gradient(176deg,rgba(248,242,229,.9),rgba(232,222,203,.6))}
.life-cell.done::after{content:"";position:absolute;inset:7px;border:1px solid rgba(92,76,51,.1)}
.life-cell.lock{cursor:default;opacity:.5}
.life-cell.lock:hover{transform:none;box-shadow:none;border-color:rgba(92,76,51,.22)}
.life-cell .seal{position:absolute;right:16px;bottom:46px;width:30px;height:30px;border:1.5px solid rgba(165,50,42,.6);
  color:var(--cinnabar);font-family:var(--kai);font-size:13px;display:flex;align-items:center;
  justify-content:center;letter-spacing:0;transform:rotate(-4deg);opacity:.9}
.hand-strip{margin-top:34px;padding:22px 26px;border-left:2px solid rgba(165,50,42,.28);
  background:linear-gradient(90deg,rgba(255,253,247,.5),rgba(255,253,247,0))}
.hand-strip .ttl{font-family:var(--kai);font-size:11px;letter-spacing:.34em;color:var(--ink3);margin-bottom:12px}
.hand-strip p{font-family:var(--kai);font-size:13.5px;line-height:2.3;color:var(--ink1);letter-spacing:.1em}

/* ── 掷局 ── */
.roll-box{text-align:center;padding:72px 0 40px;position:relative;min-height:330px}
.roll-era{font-size:96px;letter-spacing:.1em;color:var(--ink);font-family:var(--song);
  line-height:1;transition:.3s}
.roll-era.flick{opacity:.5;filter:blur(1.2px)}
.roll-yr{margin-top:26px;font-family:var(--kai);font-size:15px;letter-spacing:.44em;color:var(--ink2)}
.roll-gan{margin-top:12px;font-family:var(--kai);font-size:12px;letter-spacing:.3em;color:var(--ink3)}
.roll-note{margin-top:30px;font-family:var(--kai);font-size:12px;line-height:2.2;color:var(--cinnabar);
  letter-spacing:.12em}
.origins{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:44px}
.origin{border:1px solid rgba(92,76,51,.22);padding:20px 20px 18px;cursor:pointer;
  background:linear-gradient(176deg,rgba(255,253,247,.55),rgba(244,236,219,.28));
  transition:.44s var(--slow);position:relative}
.origin:hover{border-color:rgba(92,76,51,.5);transform:translateY(-3px);
  box-shadow:0 20px 40px -30px rgba(64,48,24,.7)}
.origin h4{font-size:15.5px;font-weight:400;letter-spacing:.18em;margin-bottom:10px}
.origin .d{font-family:var(--kai);font-size:11.5px;line-height:2;color:var(--ink2);letter-spacing:.06em;
  min-height:46px}
.origin .six{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 11px;font-family:var(--kai);
  font-size:11.5px;color:var(--ink3);letter-spacing:.06em}
.origin .six i{font-style:normal;color:var(--ink2)}
.origin-solo{max-width:430px;margin:34px auto 0;padding:26px 28px 24px;cursor:default}
.origin-solo:hover{transform:none;box-shadow:none;border-color:rgba(92,76,51,.22)}
.origin-solo h4{font-size:18px;letter-spacing:.24em}
.origin-solo .d{min-height:0}
.origin-solo .tag{position:absolute;right:-8px;top:-12px;font-family:var(--kai);font-size:10.5px;
  letter-spacing:.32em;color:var(--cinnabar);border:1px solid rgba(160,60,48,.55);
  padding:4px 8px 4px 11px;background:rgba(252,248,238,.92);transform:rotate(5deg)}

/* ── 一局 ── */
.life-top{display:flex;align-items:baseline;gap:22px;padding-bottom:12px;
  border-bottom:1px solid rgba(92,76,51,.2);margin-bottom:26px;font-family:var(--kai);
  font-size:11.5px;letter-spacing:.26em;color:var(--ink3)}
.life-top .em{color:var(--ink);font-size:13px;letter-spacing:.3em}
.life-top .sp{flex:1}
.life-top .shou b{color:var(--cinnabar);font-weight:400}
.stage{display:grid;grid-template-columns:212px 1fr;gap:44px;align-items:start}
.sixbar{border-top:1px solid rgba(92,76,51,.2)}
.row6{display:grid;grid-template-columns:30px 1fr 34px;align-items:center;gap:12px;
  padding:13px 0;border-bottom:1px solid rgba(92,76,51,.13)}
.row6 .k{font-family:var(--kai);font-size:13px;letter-spacing:.14em;color:var(--ink1)}
.row6 .track{height:2px;background:rgba(92,76,51,.14);position:relative;overflow:visible}
.row6 .fill{position:absolute;left:0;top:-1px;height:4px;transition:width .8s var(--slow);
  background:var(--ink2)}
.row6 .n{font-family:var(--kai);font-size:11.5px;text-align:right;color:var(--ink3);
  transition:color .4s}
.row6.up .n{color:var(--cinnabar)}
.row6.dn .n{color:var(--azurite)}
.row6[data-k="室"] .fill{background:var(--jade)}
.row6[data-k="财"] .fill{background:var(--ochre)}
.row6[data-k="子"] .fill{background:var(--azurite)}
.row6[data-k="禄"] .fill{background:var(--cinnabar)}
.row6[data-k="寿"] .fill{background:var(--ink2)}
.row6[data-k="誉"] .fill{background:var(--gold)}
/* 未明：一格也不给你看。只剩虚线，和一个"·" */
.row6.veiled .k{color:var(--ink3)}
.row6.veiled .track{height:2px;background:
  repeating-linear-gradient(90deg,rgba(92,76,51,.17) 0 2px,transparent 2px 9px)}
.row6.veiled .n{color:rgba(92,76,51,.42);letter-spacing:.24em}
.row6.veiled .fill{display:none}
.row6.shown{animation:rowIn .9s var(--slow) both}
@keyframes rowIn{0%{opacity:0;transform:translateX(-8px)}100%{opacity:1;transform:none}}
.inknum{margin-top:26px;font-family:var(--kai);font-size:10.5px;letter-spacing:.2em;
  color:var(--ink3);line-height:2.1}

.card{position:relative;border:1px solid rgba(92,76,51,.24);
  background:linear-gradient(178deg,rgba(255,253,247,.92),rgba(246,238,222,.72));
  box-shadow:0 36px 70px -46px rgba(64,48,24,.6);padding:34px 38px 30px}
.card::after{content:"";position:absolute;inset:7px;border:1px solid rgba(92,76,51,.09);pointer-events:none}
.card-h{position:relative;height:96px;margin:-34px -38px 24px;background-size:cover;
  background-position:center 44%;opacity:.38;mix-blend-mode:multiply;filter:contrast(1.05) sepia(.06);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 62%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 62%,transparent 100%)}
.card .meta{font-family:var(--kai);font-size:10.5px;letter-spacing:.3em;color:var(--ink3);
  margin-bottom:12px}
.card h3{font-size:23px;font-weight:400;letter-spacing:.2em;margin-bottom:18px}
.card .body{font-family:var(--kai);font-size:14px;line-height:2.32;color:var(--ink1);
  letter-spacing:.06em;max-width:640px}
.card .echo{margin-top:14px;font-family:var(--kai);font-size:11.5px;color:var(--ink3);
  letter-spacing:.1em;border-top:1px dashed rgba(92,76,51,.2);padding-top:12px}
.opts{margin-top:26px;border-top:1px solid rgba(92,76,51,.18)}
.opt{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:16px 6px;
  border-bottom:1px solid rgba(92,76,51,.13);cursor:pointer;transition:.38s var(--slow)}
.opt:hover{background:linear-gradient(90deg,rgba(92,76,51,.05),rgba(92,76,51,0));
  padding-left:14px;padding-right:2px}
.opt .t{font-family:var(--kai);font-size:15px;letter-spacing:.16em;color:var(--ink)}
.opt .t em{font-style:normal;color:var(--ink3);font-size:12px;letter-spacing:.06em;margin-left:14px}
.opt .c{font-family:var(--kai);font-size:10.5px;letter-spacing:.18em;color:var(--ink4)}
.opt.dead{opacity:.3;pointer-events:none;text-decoration:line-through}
.flash{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;
  text-align:center;pointer-events:none}
.deltas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.deltas span{font-family:var(--kai);font-size:15px;letter-spacing:.1em;padding:6px 12px;
  background:rgba(255,253,247,.82);border:1px solid rgba(92,76,51,.2);
  animation:dpop 1.5s var(--slow) both}
@keyframes dpop{0%{opacity:0;transform:translateY(8px) scale(.96)}
  18%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
/* 透：某一格到了头，六事全亮 */
.flash.reveal{left:0;top:0;width:100%;height:100%;transform:none;
  display:flex;align-items:center;justify-content:center;
  background:rgba(247,243,235,.8);backdrop-filter:blur(2px)}
.reveal .rv{padding:26px 34px 24px;background:rgba(255,253,247,.96);
  border:1px solid rgba(92,76,51,.28);position:relative;
  min-width:392px;text-align:center;
  box-shadow:0 14px 44px rgba(70,58,40,.14);
  animation:dpop 3.3s var(--slow) both}
.reveal .seal{position:absolute;right:-14px;top:-16px;width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--kai);font-size:20px;color:#fff;background:var(--cinnabar);
  border:none;opacity:1;transform:rotate(7deg);transition:none;
  box-shadow:0 2px 10px rgba(150,40,30,.28)}
.reveal .t{font-size:17px;letter-spacing:.34em;margin-bottom:10px}
.reveal .s{font-family:var(--kai);font-size:11.5px;letter-spacing:.12em;
  color:var(--ink2);margin-bottom:16px}
.reveal .nums{display:flex;gap:13px;justify-content:center;flex-wrap:wrap;
  font-family:var(--kai);font-size:12px;letter-spacing:.1em;color:var(--ink3)}
.reveal .nums b{font-weight:400;color:var(--ink);margin-left:4px}

/* ── 局末 ── */
.verdict{text-align:center;padding:18px 0 8px}
.verdict .big{font-size:30px;letter-spacing:.3em;margin-bottom:18px}
.verdict .why{font-family:var(--kai);font-size:13.5px;line-height:2.3;color:var(--ink2);letter-spacing:.1em}
.hand-card{margin:44px auto 0;max-width:640px;border-top:1px solid rgba(92,76,51,.22);
  border-bottom:1px solid rgba(92,76,51,.22);padding:30px 0}
.hand-card .ttl{font-family:var(--kai);font-size:10.5px;letter-spacing:.42em;color:var(--ink3);
  text-align:center;margin-bottom:22px}
.hand-card p{font-family:var(--kai);font-size:15px;line-height:2.6;color:var(--ink1);
  letter-spacing:.12em;text-align:center}
.edits{max-width:640px;margin:30px auto 0;text-align:center}
.edits .ttl{font-family:var(--kai);font-size:10.5px;letter-spacing:.42em;color:var(--cinnabar);margin-bottom:12px}
.edits p{font-family:var(--kai);font-size:12.5px;line-height:2.2;color:var(--ink2);letter-spacing:.1em}
.center{text-align:center;margin-top:46px}

/* ── 命书 ── */
.book{position:relative;max-width:760px;margin:0 auto;padding:56px 54px 46px;
  background:linear-gradient(178deg,rgba(255,253,247,.94),rgba(243,234,215,.8));
  border:1px solid rgba(92,76,51,.24);box-shadow:0 40px 84px -50px rgba(64,48,24,.66)}
.book::after{content:"";position:absolute;inset:8px;border:1px solid rgba(92,76,51,.1);pointer-events:none}
.book::before{content:"";position:absolute;left:50%;top:-1px;transform:translateX(-50%);
  width:64px;height:3px;background:var(--cinnabar);opacity:.46}
.book .pil{display:flex;flex-direction:row-reverse;gap:34px;justify-content:center}
.zhu{writing-mode:vertical-rl;text-orientation:upright;font-size:15px;letter-spacing:.34em;
  color:var(--ink1);line-height:1}
.zhu.lead{font-size:11.5px;letter-spacing:.5em;color:var(--ink3)}
.cai-list{margin-top:40px;border-top:1px solid rgba(92,76,51,.2)}
.cai{display:grid;grid-template-columns:34px 236px 66px 1fr;gap:14px;align-items:center;
  padding:14px 2px;border-bottom:1px solid rgba(92,76,51,.12)}
.cai .k{font-family:var(--kai);font-size:14px;letter-spacing:.16em}
.cai .track{height:2px;background:rgba(92,76,51,.13);position:relative}
.cai .fill{position:absolute;left:0;top:-1px;height:4px;background:var(--ink1);
  width:0;transition:width 1.3s var(--slow)}
.cai .v{font-family:var(--kai);font-size:12px;text-align:center;color:var(--ink2);letter-spacing:.08em}
.cai .note{font-family:var(--kai);font-size:11.5px;color:var(--ink3);letter-spacing:.1em}
.cai.top .fill{background:var(--cinnabar)}
.cai.top .note{color:var(--cinnabar)}
.gates{margin-top:34px;display:flex;gap:0;justify-content:center;
  border-top:1px solid rgba(92,76,51,.18);padding-top:22px}
.gates div{text-align:center;flex:1;font-family:var(--kai);font-size:12px;letter-spacing:.16em;
  color:var(--ink2);position:relative}
.gates div+div::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;
  background:rgba(92,76,51,.14)}
.gates b{display:block;font-weight:400;font-size:19px;color:var(--ink);letter-spacing:.1em;margin-bottom:6px}
.book-foot{margin-top:30px;text-align:center;font-family:var(--kai);font-size:11px;
  letter-spacing:.24em;color:var(--ink3)}
.seal{position:absolute;right:64px;bottom:40px;width:52px;height:52px;border:2px solid rgba(165,50,42,.62);
  color:var(--cinnabar);font-family:var(--kai);font-size:15px;line-height:1.05;
  display:flex;align-items:center;justify-content:center;transform:rotate(-3.5deg);
  opacity:0;transition:opacity 1s ease .9s;letter-spacing:0;text-align:center}
.seal.on{opacity:.92}

/* ── 天机 ── */
.ge{max-width:680px;margin:0 auto;text-align:center}
.ge .name{font-size:44px;letter-spacing:.36em;margin:12px 0 24px}
.ge .say{font-family:var(--kai);font-size:18px;letter-spacing:.18em;color:var(--ink1);
  line-height:2.1;padding:26px 0;border-top:1px solid rgba(92,76,51,.2);
  border-bottom:1px solid rgba(92,76,51,.2)}
.ge .eff{margin-top:26px;font-family:var(--kai);font-size:12.5px;line-height:2.3;
  color:var(--ink2);letter-spacing:.1em}
.tag{display:inline-block;font-family:var(--kai);font-size:10px;letter-spacing:.3em;
  color:var(--ink3);border:1px solid rgba(92,76,51,.24);padding:4px 10px}

html.static *{animation:none !important;transition:none !important}
.six-final{display:flex;gap:0;justify-content:center;max-width:560px;margin:26px auto 0;
  border-top:1px solid rgba(92,76,51,.16);border-bottom:1px solid rgba(92,76,51,.16);padding:14px 0}
.six-final div{flex:1;text-align:center;font-family:var(--kai);position:relative}
.six-final div+div::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:1px;background:rgba(92,76,51,.12)}
.six-final span{display:block;font-size:10.5px;letter-spacing:.24em;color:var(--ink3);margin-bottom:6px}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const GAN = '甲乙丙丁戊己庚辛壬癸';
const ZHI = '子丑寅卯辰巳午未申酉戌亥';
const GAN_WX = {甲:'木',乙:'木',丙:'火',丁:'火',戊:'土',己:'土',庚:'金',辛:'金',壬:'水',癸:'水'};
const ZHI_WX = {子:'水',丑:'土',寅:'木',卯:'木',辰:'土',巳:'火',午:'火',未:'土',申:'金',酉:'金',戌:'土',亥:'水'};
const WX_CAI = {木:'智',火:'言',土:'忍',金:'体',水:'巧'};
const SHENG = {木:'火',火:'土',土:'金',金:'水',水:'木'};
const HE = ['子丑','寅亥','卯戌','辰酉','巳申','午未'];
const CHONG = ['子午','丑未','寅申','卯酉','辰戌','巳亥'];
const SIXK = ['室','财','子','禄','寿','誉'];
const CAIK = ['智','体','言','巧','忍','缘'];

/* ══════════════ 八字 ══════════════ */
function ganZhiOfYear(y){
  const a = ((y - 4) % 10 + 10) % 10, b = ((y - 4) % 12 + 12) % 12;
  return [GAN[a], ZHI[b]];
}
// 五虎遁：年干→寅月干
const TIGER = ['丙','戊','庚','壬','甲'];
function monthPillar(yearGan, zhiIdx){
  const yi = GAN.indexOf(TIGER[GAN.indexOf(yearGan) % 5]);
  const k = ((zhiIdx - 2) + 12) % 12;             // 寅=0
  return [GAN[(yi + k) % 10], ZHI[zhiIdx]];
}
// 五鼠遁：日干→子时干
const RAT = ['甲','丙','戊','庚','壬'];
function hourPillar(dayGan, zhiIdx){
  const zi = GAN.indexOf(RAT[GAN.indexOf(dayGan) % 5]);
  return [GAN[(zi + zhiIdx) % 10], ZHI[zhiIdx]];
}

function makeBazi(){
  const y = 1500 + R(90);
  const [yg] = ganZhiOfYear(y);
  const mi = R(12);
  const m = monthPillar(yg, mi);
  const di = R(60);
  const d = [GAN[di % 10], ZHI[di % 12]];
  const hi = R(12);
  const h = hourPillar(d[0], hi);
  return [ganZhiOfYear(y).join(''), m.join(''), d.join(''), h.join('')];
}

function analyseBazi(pillars){
  const chars = pillars.join('').split('');
  const wx = {木:0,火:0,土:0,金:0,水:0};
  chars.forEach(c => { const w = GAN_WX[c] || ZHI_WX[c]; if (w) wx[w]++; });

  const dg = pillars[2][0], dz = pillars[2][1];
  const mz = pillars[1][1];
  const main = WX_CAI[GAN_WX[dg]];
  const dw = GAN_WX[dg], mw = ZHI_WX[mz];
  const de = (mw === dw || SHENG[mw] === dw);

  const cap = {};
  CAIK.forEach(k => { cap[k] = 78; });
  for (const w in wx){
    const c = wx[w], k = WX_CAI[w];
    let v = 78;
    if (c === 0) v = 58;
    else if (c === 1) v = 70;
    else if (c >= 4) v = 88;
    cap[k] = v;
  }
  cap[main] = clamp(cap[main] + (de ? 15 : -15), 5, 95);
  // 主才封顶 95：旺且得时
  if (wx[GAN_WX[dg]] >= 4 && de) cap[main] = 95;

  // 缘：合冲
  const zhis = [pillars[0][1], pillars[1][1], pillars[2][1], pillars[3][1]];
  let he = 0, ch = 0;
  for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++){
    const p = zhis[i] + zhis[j];
    if (HE.includes(p) || HE.includes(zhis[j] + zhis[i])) he++;
    if (CHONG.includes(p) || CHONG.includes(zhis[j] + zhis[i])) ch++;
  }
  cap['缘'] = clamp(60 + 12 * he - 12 * ch, 5, 90);

  const gates = [
    25 + (ZHI.indexOf(dz) % 11),
    40 + (ZHI.indexOf(pillars[0][1]) % 11),
    55 + (ZHI.indexOf(pillars[3][1]) % 11)
  ];

  const init = {};
  CAIK.forEach(k => { init[k] = clamp(25 + wx[Object.keys(WX_CAI).find(w => WX_CAI[w] === k)] * 8, 5, cap[k]); });
  init['缘'] = clamp(60 + 12 * he - 12 * ch, 5, cap['缘']);

  return { pillars, wuxing: wx, main, de, cap, gates, init, he, ch };
}

const ERA_AN = { from:1494, to:1594 };
const ERA_MO = { from:2020, to:2032 };

function eraColor(era){ return era === 'an' ? '' : 'mo'; }

function yearLabel(y, era){
  if (era === 'mo') return y + ' 年';
  const tab = [
    [1488, 1505, '弘治', 1487], [1506, 1521, '正德', 1505],
    [1522, 1566, '嘉靖', 1521], [1567, 1572, '隆庆', 1566],
    [1573, 1620, '万历', 1572]
  ];
  for (const r of tab){
    if (y >= r[0] && y <= r[1]){
      const n = y - r[3];
      return r[2] + (n === 1 ? '元年' : numToCn(n) + '年');
    }
  }
  return y + ' 年';
}
function numToCn(n){
  const d = ['〇','一','二','三','四','五','六','七','八','九'];
  if (n < 10) return d[n];
  if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
  return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
}

let pending = null;

function rollLife(){
  // 古今平衡：已定四局时补缺口
  const done = S && S.lives ? S.lives.length : 0;
  const anCount = S && S.lives ? S.lives.filter(l => l.era === 'an').length : 0;
  const moCount = done - anCount;
  let era;
  if (done === 4){
    if (anCount === 1) era = 'an';
    else if (moCount === 1) era = 'mo';
    else era = Math.random() < .5 ? 'an' : 'mo';
  } else {
    era = Math.random() < .5 ? 'an' : 'mo';
  }
  const w = era === 'an' ? ERA_AN : ERA_MO;
  const y0 = w.from + R(w.to - w.from + 1);

  const el = $('#rollEra'), yr = $('#rollYr'), gn = $('#rollGan'), nt = $('#rollNote');
  $('#originBox').innerHTML = '';
  nt.innerHTML = '';
  el.className = 'roll-era flick';
  yr.textContent = '';
  gn.textContent = '';
  const marks = ['古', '今'];
  let k = 0;
  const tick = setInterval(() => {
    el.textContent = marks[k++ % 2];
    if (k > 9){
      clearInterval(tick);
      el.className = 'roll-era';
      el.textContent = era === 'an' ? '古' : '今';
      const gz = ganZhiOfYear(y0 - 16).join('');
      yr.textContent = yearLabel(y0, era);
      gn.textContent = era === 'an' ? `起局 · ${gz} 年 · 十六岁` : `起局 · 十六岁`;
      // 改史已知
      if (S && S.edits && S.edits.length && S.index > 1){
        nt.textContent = '（此世已知：' + S.edits[S.edits.length - 1].text + '）';
      }
      pending = { era, y0 };
      renderOrigins();

  }, 62);
}

function autoPickOpt(){

  list.forEach(el => {

    const home = el.dataset.home ? parseFloat(el.dataset.home) : 0;
    const v = S.strat === 'home' ? home : cai;
    if (v > bv){ bv = v; best = el; }

}

const WEBP = { court:1, home:1, journey:1, study:1, war:1, wedding:1, winter:1 };
function imgOf(head){
  if (head === 'mo_plate') return 'assets/modern.jpg';
  return 'assets/' + head + '.' + (WEBP[head] ? 'webp' : 'jpg');
}

function costTag(o){
  const parts = [];
  for (const k in (o.eff || {})){
    const v = o.eff[k];
    if (!v) continue;
    parts.push(k + (v > 0 ? '+' : '') + v);
  }
  return parts.join('　');
}

function pickEvent(){
  const L = S.life;
  const isAn = L.era === 'an';
  const hasKid = !!(L.heir && L.heir.has);
  const pool = EV.filter(e => !(e.onlyAn && !isAn)
    && (!e.needChild || hasKid)       // 没孩子就不该抽到"教子""嫁女""惊风"
    && (!e.noChild || !hasKid)        // 已经有孩子了，就不必再过继
    && (!e.minAge || L.age >= e.minAge)
    && (!e.maxAge || L.age <= e.maxAge)
    && (!e.minLu || L.six['禄'] >= e.minLu)
    && (!e.beforeJob || !(L.heir && L.heir.judged))   // 人都二十了，再谈"教"就晚了
    && (!e.noMonk || !L.monk)
    && !e.force);                       // 强制事件不进日常池
  // 历史事件：古代、禄够、第五折起、一世只一次
  const hist = EV.find(e => e.id === 'hist');
  if (isAn && hist && !L.used.includes('hist')
      && L.six['禄'] >= (hist.minLu || 40) && L.fold >= 4){
    L.used.push('hist');
    return hist;
  }
  // 律这条暗线走到 60，就不是"可能会出事"，是"哪天来人"
  const cse = EV.find(e => e.id === 'case');
  if (cse && !L.used.includes('case') && L.law >= 55 && L.age >= 24){
    L.used.push('case');
    return cse;
  }
  const fresh = pool.filter(e => !L.used.includes(e.id));
  const ev = fresh.length ? pick(fresh) : pick(pool);
  if (ev) L.used.push(ev.id);
  return ev;
}

function choose(ev, o){
  const L = S.life;
  const veilBefore = !L.revealed;
  const deltas = [];
  for (const k in (o.eff || {})){
    const raw = o.eff[k];
    if (!raw) continue;
    if (k === '子') continue;          // 子不走加减，走台阶（见 stepHeir）
    let v = Math.round(raw * 0.65);
    if (v === 0) v = raw > 0 ? 1 : -1;
    L.six[k] = clamp(L.six[k] + v, 0, 100);
    deltas.push({ k, v });
  }
  if (o.ink){
    L.ink = clamp(L.ink + o.ink, 0, 100);
    // 律是墨的影子：墨落在纸上，纸就留在衙门里
    L.law = clamp(L.law + Math.round(o.ink * .8), 0, 100);
  }
  if (o.law) L.law = clamp(L.law + o.law, 0, 100);
  if (o.lone){ L.lone = true; }
  if (ev && ev.id === 'case') L.law = 10;          // 这一案结了，账翻过去
  if (o.monk){
    L.monk = o.monk; L.lone = true;                // 方外无室
    if (!L.heir.has){ L.heir.lost = true; L.heir.has = false; }   // 无后
    heirNote(L, o.monk === '佛' ? '我把头剃了。剃刀凉，头皮也凉。' : '我上了山。山上的日子长，长得像没有尽头。');
  }

  // 子：只认三件事——教得怎样、有没有过继、这一个有没有留住
  const z0 = L.six['子'];
  if (o.raised !== undefined) L.raised = o.raised;
  if (o.adopt){
    L.heir.has = true; L.heir.born = L.age; L.heir.judged = false; L.heir.adopted = true;
    L.heir.job = L.heir.grand = L.heir.great = false;
    heirNote(L, L.age + ' 岁，族里过继来一个孩子。他改口叫我爹，声音很小。');
  }
  if (o.loseChild){
    L.heir.has = false; L.heir.lost = true; L.heir.judged = false;
    L.heir.job = L.heir.grand = L.heir.great = false;
  }
  stepHeir(L);
  stepRepute(L);
  stepReveal(L);
  const dz = Math.round(L.six['子'] - z0);
  if (dz) deltas.push({ k: '子', v: dz });

  // 六才：隐藏成长
  for (const k in (o.cai || {})){
    const v = (o.cai[k] || 0) * 4;
    L.cai[k] = clamp(L.cai[k] + v, 0, S.bz.cap[k]);
    // 到顶 = 摸到"自己那一格"的上限；缺格（cap<78）永不算
    if (S.bz.cap[k] >= 78 && L.cai[k] >= S.bz.cap[k]) S.peak[k] = S.bz.cap[k];
  }

  if (o.line) L.lines.push(o.line);

  // 改史
  if (o.edit && S.edits.length < 2){
    const t = o.edit.text;
    S.edits.push({ life: S.index, year: String(L.y0 + L.age - 16), grade: o.edit.grade, text: t });
  }

  // 结算动效。刚"透"的那一下不叠数字——面板已经全亮了，数字在牌上
  if (veilBefore && L.revealed) { /* 让位给「六事俱明」 */ }
  else showDelta(deltas);

  // 推进时间
  setTimeout(advanceFold, S.auto ? 0 : 900);
}

/* ── 子：五级台阶 ────────────────────────────────────────────
   你要的不是一个"子"的分数，是你活着的时候能不能看见：
   有后（25）→ 他立了业（20）→ 他有后（20）→ 家和（15）→ 四世同堂（20）
   一级一级往上走，缺哪一级，一眼就看得见。 */
function heirScore(L){
  const h = L.heir;
  if (!h) return 0;
  let v = 0;
  if (h.has) v += 25;
  if (h.job) v += 20;
  if (h.grand) v += 20;
  if (h.has && L.six['室'] >= 45 && L.ink <= 45) v += 15;   // 家和：屋里有人气，外头没血债
  if (h.great) v += 20;
  return clamp(v, 0, 100);
}

/* ── 誉：一极即满 ─────────────────────────────────────────────
   名声不是攒出来的，攒出来的是"人缘"。誉只有一种拿法：
   把一件事做到没人能装作没看见。室、财、子、禄，任一项到 100，誉就满。
   另一条路是剃度入山——不争了，反倒是大名。 */
function reputePeak(L){
  return ['室', '财', '子', '禄'].find(k => L.six[k] >= 100) || null;
}
function stepRepute(L){
  if (L.monk){ L.reputeFull = true; L.reputeWhy = '方外之名'; }
  else if (!L.reputeFull){
    const pk = reputePeak(L);
    if (pk){ L.reputeFull = true; L.reputeWhy = pk + '至其极'; }
  }
  if (L.reputeFull) L.six['誉'] = Math.max(L.six['誉'], 100);
}
// 律这条暗线不出条。它只在快到头的时候，透一句话给你
function lawHint(L){
  if (L.law >= 55) return '律 · 案已立案，只看哪天来人';
  if (L.law >= 35) return '律 · 风声渐紧';
  if (L.law >= 18) return '律 · 有些账，经不起人翻';
  return '';
}

/* ── 透：六事全隐，一格到 100 才全亮 ───────────────────────────
   活着的每一天，你都不知道自己几斤几两。只有一件事能让你看清：
   某一样，被你做到了头。到了头，别的就藏不住了。 */
function stepReveal(L){
  if (L.revealed) return;
  // 先看室财子禄——誉是被它们带上 100 的，"禄到了头"才是真话
  const full = ['室', '财', '子', '禄'].find(k => L.six[k] >= 100)
    || (L.six['誉'] >= 100 ? '誉' : null);
  if (!full) return;
  L.revealed = true; L.revealWhy = full; L.revealAge = L.age;
  renderSixBar();
  if (!S.auto) revealFlash(full);
}

function revealFlash(k){
  const L = S.life;
  const why = (L.monk && k === '誉')
    ? '剃了头，账就不用算了。'
    : k + '到了头。别的，也就藏不住了。';
  const div = document.createElement('div');
  div.className = 'flash reveal';
  div.innerHTML = `<div class="rv">
    <span class="seal">透</span>
    <div class="t">六 事 俱 明</div>
    <div class="s">${why}</div>
    <div class="nums">${SIXK.map(x =>
      `<span>${x}<b>${Math.round(L.six[x])}</b></span>`).join('')}</div>
  </div>`;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3400);
}

// 手记里留一句"看得见的事"。这类句子不写心情，只写发生了什么
function heirNote(L, s){ if (L.lines.length < 9) L.lines.push(s); }

// 一行字把"子孙这件事"说清楚：现在走到哪一级了
function heirHint(L){
  const h = L.heir || {};
  if (!h.has) return L.monk ? '子 · 方外无后'
    : (h.lost ? '子 · 那一个没留住' : (L.lone ? '子 · 一个人过，膝下无人' : '子 · 尚无'));
  const p = ['子 · ' + h.born + ' 岁' + (h.adopted ? '过继' : '得子')];
  p.push(!h.judged ? '尚幼' : (h.job ? '已立业' : '未成器'));
  if (h.grand) p.push(L.six['室'] >= 45 && L.ink <= 45 ? '孙辈绕膝' : '有孙');
  if (h.great) p.push('四世同堂');
  return p.join(' · ');
}

function heirLine(L){
  const h = L.heir || {};
  if (!h.has) return L.monk ? '方外之人，无后。'
    : (h.lost ? '膝下那一个，没留住。' : (L.lone ? '一个人过到老，膝下无人。' : '一生无后。'));
  const p = [h.born + ' 岁' + (h.adopted ? '过继' : '得子'), h.job ? '子立业' : '子未成器'];
  if (h.grand) p.push(L.six['室'] >= 45 && L.ink <= 45 ? '孙辈绕膝，家中和睦' : '有孙，家中不宁');
  if (h.great) p.push('四世同堂');
  return p.join(' · ');
}

function stepHeir(L){
  const h = L.heir;
  if (!h) return;
  // 得子：成家早晚，决定得子早晚。室薄的人，连儿子都来得晚
  if (!h.has && !h.lost && !L.lone && L.age >= 20){
    const need = L.age >= 36 ? 5 : (L.age >= 32 ? 8 : (L.age >= 28 ? 18 : (L.age >= 24 ? 28 : 38)));
    if (L.six['室'] >= need){
      h.has = true; h.born = L.age;
      L.six['室'] = clamp(L.six['室'] + 5, 0, 100);
      heirNote(L, L.age + ' 岁，儿子落地。抱他的时候我不敢用力。');
    }
  }
  if (h.has){
    // 立业：只看他二十岁那年。立没立起来，一次定终身
    if (h.has && !h.judged && L.age >= h.born + 20){
      const teach = Math.max(L.raised || 0, (L.cai && L.cai['智'] >= 78) ? 1 : 0);
      const sc = L.six['禄'] * .5 + L.six['财'] * .25 + teach * 30;
      h.judged = true;
      h.job = sc >= 70;
      heirNote(L, h.job ? '他做了官。我送他到门口，忽然不知道该说什么。'
                        : '他没能做上官。这件事我们父子都没提过。');
    }
    if (!h.grand && L.age >= h.born + 22){
      h.grand = true;
      heirNote(L, '他抱了个孩子回来，说要我起名。');
    }
    // 四世同堂：要活到看得见曾孙的那一年
    // 四世同堂要的是"还在一处吃饭"：人散了的四代，不算
    if (h.grand && !h.great && L.age >= h.born + 40 && L.six['室'] >= 45 && L.ink <= 45){
      h.great = true;
      heirNote(L, '曾孙满月。四代人在一个院里吃饭，我坐在最里面。');
    }
  }
  L.six['子'] = heirScore(L);
}

function advanceFold(){
  const L = S.life;
  if (!L) return;
  L.fold++;
  L.age += 4;
  // 常态流量：官照做、钱照花、人照老、家照冷
  if (L.monk){
    // 出了家，俸禄这条线就断了；清修换的是命
    L.six['财'] = clamp(L.six['财'] + 1, 0, 100);
  } else {
    L.six['禄'] = clamp(L.six['禄'] + 5, 0, 100);
    L.six['财'] = clamp(L.six['财'] + (L.six['禄'] >= 30 ? 4 : 2), 0, 100);
  }
  L.six['誉'] = clamp(L.six['誉'] + 1, 0, 100);
  // 室：有人在，家自己会长；没人管，就慢慢散
  if (!L.lone) L.six['室'] = clamp(L.six['室'] + (L.six['室'] >= 45 ? 1 : -1), 0, 100);
  stepHeir(L);
  stepRepute(L);
  L.six['寿'] = clamp(L.six['寿'] - (L.monk ? 2 : 4), 0, 100);
  stepReveal(L);
  S.bz.gates.forEach((g, i) => {
    if (!L.gateDone[i] && L.age >= g){
      L.gateDone[i] = true;
      applyGate(i);
    }
  });
  if (L.six['寿'] <= 0 || L.fold >= 12) return endLife();
  renderLife();
}

function showDelta(ds){
  if (!ds.length) return;
  const veil = S.life && !S.life.revealed;   // 没透之前只给方向，不给数
  const div = document.createElement('div');
  div.className = 'flash';
  div.innerHTML = '<div class="deltas">' + ds.map(d => veil
    ? `<span style="color:${d.v > 0 ? 'var(--cinnabar)' : 'var(--azurite)'}">${d.k} ${d.v > 0 ? '↑' : '↓'}</span>`
    : `<span style="color:${d.v > 0 ? 'var(--cinnabar)' : 'var(--azurite)'}">${d.k} ${d.v > 0 ? '+' : ''}${d.v}</span>`
  ).join('') + '</div>';
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 1600);
}

function applyGate(i){
  const L = S.life;
  const key = [S.bz.main, weakestCai(), '缘'][i];
  const val = L.cai[key] || 60;
  const pass = val + R(30) > 62;
  const div = document.createElement('div');
  div.className = 'flash';
  div.innerHTML = `<div class="deltas"><span style="color:var(--ink2)">${
    ['一','二','三'][i]}关 · ${S.bz.gates[i]} 岁 · ${pass ? '过了' : '没过'}</span></div>`;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 1800);

  if (pass){
    if (i === 0) L.cai[key] = clamp((L.cai[key] || 60) + 4, 0, S.bz.cap[key]);
    if (i === 1) S.bz.cap[key] = clamp(S.bz.cap[key] + 10, 5, 78);
    if (i === 2) L.gateGood = true;
  } else {
    if (i === 0) L.cai[key] = clamp(Math.min(L.cai[key] || 60, 70), 0, 100);
    if (i === 1){
      const ks = SIXK.slice().sort(() => Math.random() - .5).slice(0, 2);
      ks.forEach(k => { L.six[k] = clamp(L.six[k] - 8, 0, 100); });
    }
  }
}

function weakestCai(){
  let best = '智', bv = 999;
  CAIK.forEach(k => { if (S.bz.cap[k] < bv){ bv = S.bz.cap[k]; best = k; } });
  return best;
}

/* ══════════════ 局末 ══════════════ */
function endLife(reason){
  const L = S.life;
  let keys = (L.lone ? SIXK.filter(k => k !== '室') : SIXK.slice()).filter(k => k !== '寿');
  // 出了家：室与子本就不在其道，不按"缺"算
  if (L.monk) keys = keys.filter(k => k !== '子');
  // 没活到能立后的年纪，不算"绝后"——那是没来得及，不是缺
  if (L.age < 26) keys = keys.filter(k => k !== '子');
  const shouScore = clamp(Math.round((L.age - 40) * 1.8), 0, 100);
  const stat = {};
  keys.forEach(k => { stat[k] = L.six[k]; });
  if (shouScore < 35) stat['寿'] = shouScore;   // 早死才罚
  let minK = Object.keys(stat)[0];
  Object.keys(stat).forEach(k => { if (stat[k] < stat[minK]) minK = k; });
  const minV = Math.round(stat[minK]);

  let verdict, why;
  if (minV >= 60) { verdict = '六 全'; why = '六样都不算亏。你比谁都清楚代价。'; }
  else if (minV >= 40) { verdict = '寻 常'; why = '你过得去，只是每一样都差一口气。'; }
  else if (minV >= 20) { verdict = '缺 一'; why = `你赢了很多，但缺的那一样（${minK}），把其余的都说成空的。`; }
  else { verdict = '空'; why = `缺的是${minK}。它把别的都吃掉了。`; }
  why = `卒于 ${L.age} 岁 · 最薄一格是${minK}（${minV}）`;

  // 史评
  const y = L.six['誉'], lu = L.six['禄'];
  let biog;
  if (L.monk) biog = (L.monk === '佛' ? '《高僧传》' : '《高士传》') + ' —— 不载于吏部之册';
  else if (L.ink >= 60) biog = '《佞幸传》，附于某权臣传后';
  else if (y >= 70 && lu >= 50) biog = '本传';
  else if (L.six['室'] <= 5) biog = '附传 —— 无党、无室，附于某人之末';
  else if (y >= 45) biog = '循吏传';
  else biog = '无传 ——「时同僚有某者」';

  // 手记：取三句
  let lines = L.lines.slice(-3);
  while (lines.length < 3){
    lines.push(pick([
      '我这一辈子，好像一直在等一件事。',
      '我都办成了。夜里想不起来任何一件。',
      '我算过很多账，就是没算过自己。',
      '那年冬天特别长。',
      '有人劝过我，我没听。'
    ]));
  }

  const rec = {
    era: L.era,
    yearLabel: yearLabel(L.y0, L.era),
    verdict: verdict + ' · ' + minK + Math.round(L.six[minK]),
    biog, minK, minV, six: Object.assign({}, L.six), age: L.age,
    origin: L.originName, lines, heir: heirLine(L),
    repute: L.reputeFull ? L.reputeWhy : null, monk: L.monk,
    revealed: !!L.revealed, revealAt: L.revealAge || 0, revealWhy: L.revealWhy,
    heirAt: { has: L.heir.has, job: L.heir.job, grand: L.heir.grand, great: L.heir.great, born: L.heir.born }
  };

  if (!S.lives) S.lives = [];
  S.lives[S.index - 1] = rec;

  // 手记跨局（第五条后替换）
  S.hand = S.hand.concat(lines).slice(-5);
  // 错的记忆：某才天生缺，却写出"我很会"的句子
  const lack = CAIK.find(k => S.bz.cap[k] <= 58);
  if (lack && Math.random() < .55){
    const wrong = { 智:'我很会念书。这一条我从不怀疑。', 体:'我身子骨一直很好。',
      言:'我这张嘴，从来没输过。', 巧:'这些账我心里过一遍就清楚。',
      忍:'我什么都能忍。', 缘:'我人缘一向不错。' }[lack];
    S.hand[S.hand.length - 1] = wrong;
  }
  S.hand = S.hand.slice(-5);

  S.index++;
  save();
  showHand(S.index - 1);
}

function showHand(i){
  const rec = S.lives[i - 1];
  if (!rec) return;
  const isAn = rec.era === 'an';
  $('#handTitle').textContent = `第 ${'一二三四五六七八'[i-1]} 局 · 卒`;
  $('#handSub').textContent = `${rec.origin} · ${rec.yearLabel} · 卒于 ${rec.age} 岁`;

  const edits = S.edits.filter(e => e.life === i);
  $('#handBody').innerHTML = `
    <div class="verdict">
      <div class="big">${rec.verdict.split(' · ')[0]}</div>
      <div class="why">${rec.biog}</div>
    </div>
    <div class="six-final">
      ${SIXK.map(k => `<div><span>${k}</span><b>${Math.round(rec.six[k])}</b></div>`).join('')}
    </div>
    ${rec.heir ? `<div style="text-align:center;margin-top:16px;font-family:var(--kai);font-size:12.5px;
       letter-spacing:.1em;color:var(--ink2)">子 · ${rec.heir}</div>` : ''}
    ${(rec.monk || rec.repute) ? `<div style="text-align:center;margin-top:8px;font-family:var(--kai);
       font-size:12.5px;letter-spacing:.1em;color:var(--cinnabar)">誉 · ${
         rec.monk ? '方外之名（' + rec.monk + '门）' : '一极即满 —— ' + rec.repute}</div>` : ''}
    <div style="text-align:center;margin-top:8px;font-family:var(--kai);
       font-size:11.5px;letter-spacing:.12em;color:var(--ink3)">${rec.revealed
         ? `${rec.revealAt} 岁那年，六事俱明 —— ${rec.revealWhy}到了头`
         : '此世未透 · 六样一样也没看清，就过去了'}</div>
    <div class="hand-card">
      <div class="ttl">手 记 · 留给下一世</div>
      ${rec.lines.map(t => `<p>${t}</p>`).join('')}
    </div>
    ${edits.length ? `<div class="edits"><div class="ttl">此 世 所 改</div>${
      edits.map(e => `<p>${e.text}（${e.grade}）</p>`).join('')}</div>` : ''}
    <div class="center" id="handAct"></div>`;

  const act = $('#handAct');
  if (S.index > 5){
    act.innerHTML = '<span class="btn zin" id="toBook2">开 命 书</span>';
    $('#toBook2').onclick = () => { renderBook(); go('book'); };
  } else {
    act.innerHTML = '<span class="btn" id="nextLife">入 下 一 局</span>';
    $('#nextLife').onclick = () => { renderHub(); go('hub'); };
  }
  go('hand');
  if (S.auto) setTimeout(autoNext, 8);
}

function autoStartLife(){
  const done = (S.lives || []).filter(Boolean).length;
  const an = (S.lives || []).filter(l => l && l.era === 'an').length;
  let era;
  if (done === 4){ era = an === 1 ? 'an' : (an === 3 ? 'mo' : (Math.random() < .5 ? 'an' : 'mo')); }
  else era = Math.random() < .5 ? 'an' : 'mo';
  const w = era === 'an' ? ERA_AN : ERA_MO;
  pending = { era, y0: w.from + R(w.to - w.from + 1) };
  startLife(pick(ORIGINS));
}

function autoNext(){
  if (S.index > 5){
    renderBook();
    if (Object.keys(S.peak || {}).length) renderTianji();
    autoReport();
  } else autoStartLife();
}

function autoReport(){
  const out = document.createElement('div');
  out.id = 'testOut';
  const peak = Object.keys(S.peak || {}).join(',') || '无';
  const rows = (S.lives || []).map((l, i) =>
    l ? `${i+1}:${l.era}/${l.yearLabel}/${l.age}岁/${l.verdict}/${SIXK.map(k => k + Math.round(l.six[k])).join(',')}/${
      l.revealed ? '透' + l.revealAt + l.revealWhy : '未透'}` : 'null'
  ).join(' || ');
  out.setAttribute('data-test', 'OK');
  out.style.display = 'none';
  out.textContent = `lives=${S.lives.length} peak=${peak} tianji=${S.tianji || '-'} ${rows}`;
  document.body.appendChild(out);
  document.title = 'AUTO_OK peak=' + peak;
}

/* ══════════════ 命书 ══════════════ */
function renderBook(){
  const bz = S.bz;
  const [y, m, d, h] = bz.pillars;
  const notes = k => {
    const c = bz.cap[k];
    if (k === '缘') return c >= 84 ? '人缘极厚' : (c <= 60 ? '合少冲多，两头不靠' : '—');
    if (c >= 95) return '此命唯一一格 · 可至顶';
    if (c >= 88) return '可至顶（你的顶）';
    if (c <= 58) return '终身不过六十';
    if (c <= 70) return '弱，够用不够赢';
    return '—';
  };
  const html = `
  <div class="book" id="bookCard">
    <div class="pil">
      <div class="zhu lead">四柱</div>
      <div class="zhu">${y}</div><div class="zhu">${m}</div>
      <div class="zhu">${d}</div><div class="zhu">${h}</div>
    </div>
    <div class="cai-list">
      ${CAIK.map(k => `
        <div class="cai ${bz.cap[k] >= 95 ? 'top' : ''}">
          <span class="k">${k}</span>
          <span class="track"><span class="fill" data-w="${bz.cap[k]}"></span></span>
          <span class="v">${numToCn(bz.cap[k])}</span>
          <span class="note">${notes(k)}</span>
        </div>`).join('')}
    </div>
    <div class="gates">
      ${bz.gates.map((g, i) => `<div><b>${g}</b>${['一关·主才','二关·最弱','三关·缘'][i]}</div>`).join('')}
    </div>
    <div class="book-foot">此命 · ${wuxingLine(bz)}</div>
    <div class="seal" id="bookSeal">命书</div>
  </div>
  <div class="center" id="bookAct"></div>`;

  $('#bookBody').innerHTML = html;
  setTimeout(() => {
    $$('.cai .fill').forEach(f => { f.style.width = f.dataset.w + '%'; });
    $('#bookSeal').classList.add('on');
  }, 80);

  const peak = Object.keys(S.peak || {}).length > 0;
  const act = $('#bookAct');
  if (peak){
    act.innerHTML = '<span class="btn zin" id="toTianji">窥 天 机</span>';
    $('#toTianji').onclick = () => { renderTianji(); go('tianji'); };
  } else {
    act.innerHTML = '<span class="btn ghost" id="again">另 起 一 卷</span>';
    $('#again').onclick = () => { if (confirm('清掉现有的五世，重新起卷？')) reset(); };
  }
  go('book');
}

function wuxingLine(bz){
  const w = bz.wuxing;
  const lack = Object.keys(w).filter(k => w[k] === 0);
  const full = Object.keys(w).filter(k => w[k] >= 4);
  if (!lack.length && !full.length) return '五行各具，无缺无旺。';
  let t = lack.length === 0 ? '五行不缺'
    : (lack.length === 1 ? `缺${lack[0]}` : `${lack.join('')}俱缺`);
  if (full.length) t += `，${full.join('')}旺而` + (bz.de ? '得时' : '失时');
  else t += bz.de ? `，日干得时` : `，日干失时`;
  return t + '。';
}

/* ══════════════ 天机 ══════════════ */
const GE = {
  '智': { n:'偏印夺食', s:'你懂一切，只是做不成一件。', e:'每年可"先看一次底牌"；办事判定 −10。' },
  '体': { n:'羊刃驾杀', s:'你只欠一场仗。', e:'边臣线全开；寿年损 −1。' },
  '言': { n:'伤官配印', s:'你的话，比你的命长。', e:'言类判定 +10；弹章必至，每次都换来名。' },
  '巧': { n:'食神生财', s:'你手里过的东西，都会变多。', e:'财类"过一手"：财 +，誉 − 减半。' },
  '忍': { n:'官印相生', s:'你升得慢，但你一直在。', e:'考成永不落"下下"；升迁 −10。' },
  '缘': { n:'孤辰寡宿', s:'你要的东西，都得自己拿。', e:'直接进无室档且无代价；六项上限各 +5。' }
};

function renderTianji(){
  const bz = S.bz;
  const top = Object.keys(S.peak || {})[0]
    || CAIK.filter(k => bz.cap[k] === Math.max.apply(null, CAIK.map(x => bz.cap[x])))[0];
  const g = GE[top] || GE['缘'];
  S.tianji = g.n;
  save();

  $('#tianjiBody').innerHTML = `
    <div class="ge">
      <span class="tag">五世 · 摸到了自己的顶</span>
      <div class="name">${g.n}</div>
      <div class="say">「${g.s}」</div>
      <div class="eff">第六局：${g.e}<br>
        六才自今日起常显——盲打变明打。<br>
        另给两次：<b>择时</b>（挑年份）、<b>补偏</b>（一才 +10，另一才 −10）。</div>
      <div class="center">
        <span class="btn zin" id="sixth">入 第 六 局</span>
        <span class="btn ghost" id="tobook3" style="margin-left:12px">回 命 书</span>
      </div>
      <div class="book-foot" style="margin-top:34px">天机只改信息，不改难度。第六局结算仍取 min(六项)，一分不让。</div>
    </div>`;

  $('#sixth').onclick = () => {
    S.index = 6;
    S.lives[5] = null;
    save();
    renderHub(); go('hub');
  };
  $('#tobook3').onclick = () => { renderBook(); go('book'); };
  go('tianji');
}

/* ══════════════ 启动 ══════════════ */
function boot(){
  const saved = load();
  if (saved) S = saved;
  else S = newSoul();

  if (!S.lives) S.lives = [];
  if (!S.edits) S.edits = [];
  if (!S.hand) S.hand = [];
  if (!S.peak) S.peak = {};
  if (!S.index) S.index = 1;

  const p = new URLSearchParams(location.search);
  if (p.get('static')) document.documentElement.classList.add('static');
  if (p.get('dev')){ // 预置四局，便于评审
    S.lives = [
      { era:'an', yearLabel:'嘉靖五年', verdict:'缺一 · 室12', biog:'附传 —— 无党、无室', heir:'二十八岁得子 · 子未成器 · 有孙', age:58, origin:'军户', lines:['三十一岁，河道上，我三天看完了一年的账。','四十四岁，那封信我压了两个月，还是烧了。','五十七岁，她没有等我。'] },
      { era:'mo', yearLabel:'二〇二四年', verdict:'寻常 · 子22', biog:'循吏传', age:63, origin:'教师家庭', lines:['我把字签了，签得很快，快得自己都听见了。'] },
      { era:'an', yearLabel:'万历二年', verdict:'缺一 · 禄18', biog:'无传 ——「时同僚有某者」', age:49, origin:'匠户', lines:['我拖了三个月。什么都没发生，什么也没解决。'] },
      { era:'mo', yearLabel:'二〇二八年', verdict:'六全', biog:'本传', age:71, origin:'单亲', lines:['我教了他三年。他记住的不是书，是我坐在旁边那盏灯。'] }
    ];
    S.index = 5; S.hand = S.lives[3].lines;
  }
  if (p.get('auto')){
    S.auto = true; S.smart = !!p.get('smart'); S.strat = p.get('strat') || 'cai'; S.index = 1; S.lives = []; S.hand = []; S.edits = []; S.peak = {}; S.tianji = null;
    autoStartLife();
    return;
  }
  const demo = p.get('demo');
  if (demo === 'roll'){
    pending = { era: Math.random() < .5 ? 'an' : 'mo', y0: 1526 };
    go('roll'); renderOrigins();
    $('#rollEra').textContent = pending.era === 'an' ? '古' : '今';
    $('#rollYr').textContent = yearLabel(1526, pending.era);
    $('#rollGan').textContent = pending.era === 'an' ? '起局 · 十六岁 · 丙戌年' : '起局 · 十六岁';
    return;
  }
  if (demo === 'life'){
    S.lives = []; S.index = 1;
    const isMo = p.get('era') === 'mo';
    pending = { era: isMo ? 'mo' : 'an', y0: isMo ? 2026 : 1526 };
    startLife(ORIGINS[0]); go('life');
    return;
  }
  if (demo === 'hand'){
    if (!S.lives || !S.lives.length){
      S.lives = [{ era:'an', yearLabel:'嘉靖五年', verdict:'缺 一 · 室18', biog:'附传 —— 无党、无室',
        heir:'二十四岁得子 · 子立业 · 有孙 · 家中不宁', repute:'禄至其极',
        age:58, origin:'军户', lines:['三十一岁，河道上，我三天看完了一年的账。','四十四岁，那封信我压了两个月，还是烧了。','五十七岁，她没有等我。'], six:{室:18,财:40,子:65,禄:55,寿:0,誉:60} }];
      S.index = 2; S.hand = S.lives[0].lines;
      S.edits = [{ life:1, year:'1550', grade:'中', text:'俺答未至' }];
    }
    showHand(1);
    return;
  }
  const sc = p.get('screen');
  if (sc === 'hub'){ renderHub(); go('hub'); }
  else if (sc === 'book'){ renderBook(); }
  else if (sc === 'tianji'){ renderTianji(); }
  else { renderCover(); go('cover'); }
}
boot();
</script>
